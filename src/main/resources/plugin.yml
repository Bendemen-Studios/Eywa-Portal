name: EywaPortal
version: '${version}'
main: com.bendemen.eywaportal.EywaPortalPlugin
api-version: '26.3'
author: Bendemen-Studios
description: Eywa-themed portal particles and teleport transitions for EssentialsX warps.
softdepend:
  - Essentials
  - VEngine
commands:
  eywaportal:
    description: EywaPortal administration and test commands.
    usage: /eywaportal <reload|test>
    permission: eywaportal.admin
permissions:
  eywaportal.admin:
    description: Allows administration of EywaPortal.
    default: op
