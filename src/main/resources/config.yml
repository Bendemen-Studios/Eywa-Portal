# EywaPortal — EywaMC portal transitions
# Fullscreen Java overlay requires the generated Java resource pack merged into your existing pack.
# Bedrock via Geyser currently uses the compatible title, particle, sound and darkness fallback.

warp-command:
  enabled: true
  aliases:
    - warp
    - essentials:warp
  countdown-seconds: 3

# Commands that should open the Eywa portal before running the original command.
# Add namespaced aliases here if your teleport plugin uses them.
portal-commands:
  aliases:
    - tpaccept
    - essentials:tpaccept
    - home
    - essentials:home
    - spawn
    - essentials:spawn

visuals:
  particle-count-per-tick: 18
  radius: 1.15
  height: 2.2
  rotation-speed: 0.28
  particles:
    - END_ROD
    - WITCH
    - SOUL_FIRE_FLAME
  arrival-burst-count: 45

fullscreen-overlay:
  enabled: true
  # Only plays for Java players after the server resource pack reports SUCCESSFULLY_LOADED.
  # Merge the generated resource pack assets into the pack you already send via RSPM/server.properties.
  frames: 8
  frame-interval-ticks: 2

screen-transition:
  enabled: true
  darkness-effect: true
  darkness-ticks: 30
  title: '<#55FFFF><bold>EYWA PORTAL</bold>'
  subtitle: '<#B7F7FF>Opening in <seconds>...'
  arrival-title: '<#55FFFF><bold>PORTAL OPENED</bold>'
  arrival-subtitle: '<#D9FFFF>You have arrived.'

messages:
  prefix: '<#5555FF><bold>EywaMC</bold> <reset><#555555>|'
  starting: '<#AAAAAA>ᴇʏᴡᴀ ᴘᴏʀᴛᴀʟ ɪs ᴏᴘᴇɴɪɴɢ...'
  cancelled: '<#FF7777>ᴛʀᴀɴsɪᴛɪᴏɴ ᴄᴀɴᴄᴇʟʟᴇᴅ.'
  no-permission: '<#FF7777>ʏᴏᴜ ᴄᴀɴɴᴏᴛ ᴜsᴇ ᴛʜɪs ᴄᴏᴍᴍᴀɴᴅ.'

vengine:
  enabled: true
  effect: 'eywa_portal'
  scale: 1.0
