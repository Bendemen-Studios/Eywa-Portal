name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: gradle build --no-daemon
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Java fullscreen resource pack
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python tools/build-resource-pack.py
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: eywaportal-build
          path: |
            build/libs/*.jar
            build/eywaportal-java-resourcepack.zip
          if-no-files-found: error
